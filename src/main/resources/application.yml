# ==========================================================
# SWAGGER / OPENAPI
# =========================================================


# ==========================================================
# CUSTOM KAFKA TOPICS
# ==========================================================
kafka:
  topics:
    payment-requested: topic_payment_requested
    payment-initiated: topic_payment_initiated
    payment-processed: topic_payment_confirmed
    payment-failed: topic_payment_failed


# ==========================================================
# ALERTING CONFIGURATION
# ==========================================================
alert:
  enabled: true
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}
    channel: "#payment-alerts"
  email:
    enabled: false
    recipients: ops@forvmom.com
  pagerduty:
    enabled: false
    integration-key: ${PAGERDUTY_KEY:}


# ==========================================================
# MONITORING & METRICS
# ==========================================================
monitoring:
  dead-letter:
    alert-threshold: 5  # Alert if more than 5 dead letters in an hour
  processing-time:
    slow-threshold-ms: 5000  # Alert if payment takes longer than 5 seconds

# ==========================================================
# SWAGGER / OPENAPI
# ==========================================================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /v3/api-docs
    persist-authorization: true
  api-docs:
    path: /v3/api-docs